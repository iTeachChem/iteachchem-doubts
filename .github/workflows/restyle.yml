name: Restyle only (no Discord pull)

# Re-publishes the page with the current viewer-template.html, reusing the doubts that are
# already live. Runs by itself when only the page design changes; never contacts Discord.
# New doubts still arrive only through the weekly "Build & Deploy Doubts Index" workflow.
on:
  push:
    branches: [main]
    paths: ['viewer-template.html', 'restyle-only.js']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  restyle-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Restyle with the doubts already live (no Discord)
        env:
          SERVER_NAME: iTeachChem
          OUTPUT_FILE: public/index.html
        run: node restyle-only.js

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
