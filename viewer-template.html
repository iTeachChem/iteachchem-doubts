<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700;900&display=swap" rel="stylesheet">
<title>__SERVER_NAME__ — Doubts Index</title>
<style>
:root{
  --navy:#1b1b2f;--navy2:#21213a;--navy3:#2a2a45;--blue:#1865f2;--teal:#14bf96;--green:#71cf45;
  --purple:#9059ff;--orange:#ff8c00;--red:#e53e3e;--white:#fff;--border:#2e2e50;--text:#e8eaf0;
  --muted:#8891a8;--shadow:0 2px 12px rgba(0,0,0,.35);--r:8px;--pill:999px;
  --chem:#14bf96;--phys:#1865f2;--math:#9059ff;--bio:#71cf45;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%;font-family:"Lato",-apple-system,sans-serif;font-size:14px;background:var(--navy);color:var(--text);overflow-x:hidden}
#topbar{position:sticky;top:0;z-index:200;background:var(--navy2);border-bottom:1px solid var(--border);padding:0 24px;display:flex;align-items:center;gap:16px;height:58px;box-shadow:var(--shadow)}
.logo{font-size:16px;font-weight:900;white-space:nowrap;display:flex;align-items:center;gap:8px}
.logo-icon{width:32px;height:32px;border-radius:8px;background:linear-gradient(135deg,var(--teal),var(--blue));display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0}
.search-wrap{flex:1;max-width:420px;position:relative;margin-left:8px}
.search-wrap input{width:100%;background:var(--navy3);border:1.5px solid var(--border);color:var(--text);padding:8px 14px 8px 36px;border-radius:var(--pill);font-size:14px;font-family:inherit;outline:none}
.search-wrap input:focus{border-color:var(--blue)}
.search-wrap svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);opacity:.45;pointer-events:none}
.stats{margin-left:auto;font-size:12px;color:var(--muted);white-space:nowrap}
.last-updated{font-size:11px;color:var(--muted);opacity:.7}
#subject-nav{display:flex;gap:4px;padding:14px 24px 0;border-bottom:1px solid var(--border);background:var(--navy2);flex-wrap:wrap}
.s-tab{padding:9px 20px;border-radius:6px 6px 0 0;font-size:13px;font-weight:700;cursor:pointer;border:none;background:transparent;color:var(--muted);display:flex;align-items:center;gap:6px}
.s-tab:hover{color:var(--text);background:rgba(255,255,255,.05)}
.s-tab.active{background:var(--navy);border:1px solid var(--border);border-bottom:none;color:var(--white)}
.s-tab[data-s="chemistry"].active{color:var(--chem)}
.s-tab[data-s="physics"].active{color:var(--phys)}
.s-tab[data-s="maths"].active{color:var(--math)}
.s-tab[data-s="biology"].active{color:var(--bio)}
.s-tab .count{background:rgba(255,255,255,.08);border-radius:var(--pill);padding:1px 8px;font-size:11px;font-weight:700}
#layout{display:grid;grid-template-columns:260px 1fr;gap:0;align-items:start}
#sidebar{position:sticky;top:58px;align-self:start;max-height:calc(100vh - 58px);overflow-y:auto;padding:16px 12px 40px;border-right:1px solid var(--border);background:var(--navy2)}
.branch{margin-bottom:10px}
.branch-h{font-size:11px;font-weight:900;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);padding:6px 8px 4px}
.ch-item{display:flex;justify-content:space-between;gap:8px;align-items:center;padding:6px 10px;border-radius:6px;cursor:pointer;font-size:13px;color:var(--text);user-select:none}
.ch-item:hover{background:var(--navy3)}
.ch-item.active{background:var(--blue);color:#fff;font-weight:700}
.ch-item .n{font-size:11px;color:var(--muted);background:rgba(255,255,255,.06);border-radius:var(--pill);padding:1px 7px;flex-shrink:0}
.ch-item.active .n{color:#fff;background:rgba(255,255,255,.2)}
.ch-all{font-weight:700;margin-bottom:6px;border:1px solid var(--border)}
#ch-toggle-wrap{display:none}
#content{padding:16px 24px 60px}
#subbar{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.sub-chip{padding:4px 12px;border-radius:var(--pill);font-size:12px;font-weight:700;cursor:pointer;background:var(--navy3);border:1px solid var(--border);color:var(--muted)}
.sub-chip:hover{color:var(--text)}
.sub-chip.active{background:var(--purple);color:#fff;border-color:var(--purple)}
#crumb{font-size:12px;color:var(--muted);margin-bottom:12px}
#crumb b{color:var(--text)}
#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:12px}
.card{background:var(--navy2);border:1px solid var(--border);border-radius:var(--r);padding:13px 14px 11px;cursor:pointer;transition:border-color .12s,transform .12s;display:flex;flex-direction:column;gap:9px}
.card:hover{border-color:var(--blue);transform:translateY(-2px)}
.card-title{font-size:14px;font-weight:700;line-height:1.35;word-break:break-word}
.tags{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.tag{font-size:11px;font-weight:700;padding:2px 9px;border-radius:var(--pill)}
.tag-ch{background:rgba(24,101,242,.16);color:#7aa8ff}
.tag-sub{background:rgba(144,89,255,.16);color:#c0a3ff}
.tag-low{background:rgba(255,140,0,.16);color:var(--orange);cursor:help}
.tag-uncat{background:rgba(229,62,62,.16);color:#ff8585}
.tag-img{background:rgba(20,191,150,.16);color:var(--teal)}
.tag-pin{background:rgba(255,140,0,.18);color:var(--orange)}
.tag-solved{background:rgba(113,207,69,.18);color:var(--green)}
.card-preview{font-size:12.5px;color:var(--muted);line-height:1.4;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.card-date{margin-left:auto;align-self:center;font-size:11px;color:var(--muted);white-space:nowrap}
.footer{display:flex;gap:7px;margin-top:auto;padding-top:3px}
.t-link-btn{flex:0 0 auto;display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;padding:5px 11px;border-radius:6px;text-decoration:none;border:1px solid var(--border)}
.t-link-discord{background:#5865f2;color:#fff;border-color:#5865f2}
.t-link-discord:hover{filter:brightness(1.1)}
.t-link-ao{background:var(--navy3);color:var(--teal)}
.t-link-ao:hover{border-color:var(--teal)}
#empty{display:none;text-align:center;padding:60px 20px;color:var(--muted)}
#empty h3{color:var(--text);margin-bottom:6px}
#more{text-align:center;padding:16px 0 8px}
#more-btn{background:var(--navy3);border:1px solid var(--border);color:var(--text);font-weight:700;font-size:13px;padding:11px 26px;border-radius:8px;cursor:pointer}
#more-btn:hover{border-color:var(--blue)}
@media(max-width:760px){
  #layout{grid-template-columns:1fr}
  #grid{grid-template-columns:1fr}
  .stats{display:none}
  .logo span{display:none}
  #ch-toggle-wrap{display:block;padding:10px 14px 0;background:var(--navy2)}
  #ch-toggle{width:100%;padding:11px 14px;border-radius:8px;background:var(--navy3);border:1px solid var(--border);color:var(--text);font-weight:700;font-size:13px;text-align:left;cursor:pointer}
  #sidebar{position:static;max-height:0;overflow:hidden;border-right:none;padding:0 12px}
  #sidebar.open{max-height:60vh;overflow-y:auto;padding:12px 12px;border-bottom:1px solid var(--border)}
}
</style>
</head>
<body>
<header id="topbar">
  <div class="logo"><div class="logo-icon">📚</div><span>__SERVER_NAME__ · Doubts Index</span></div>
  <div class="search-wrap">
    <svg width="14" height="14" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
    <input id="search-input" type="search" placeholder="Search doubts...">
  </div>
  <div class="stats"><span id="thread-count">__COUNT__</span> doubts · chapter + type tagged<span class="last-updated"> · Updated __UPDATED__</span></div>
</header>
<nav id="subject-nav" role="tablist">
  <button class="s-tab active" data-s="chemistry">⚗️ Chemistry <span class="count" id="cnt-chemistry">0</span></button>
  <button class="s-tab" data-s="physics">🌡️ Physics <span class="count" id="cnt-physics">0</span></button>
  <button class="s-tab" data-s="maths">🧮 Maths <span class="count" id="cnt-maths">0</span></button>
  <button class="s-tab" data-s="biology">🧬 Biology <span class="count" id="cnt-biology">0</span></button>
  <button class="s-tab" data-s="all">🗂️ All <span class="count" id="cnt-all">0</span></button>
</nav>
<div id="ch-toggle-wrap"><button id="ch-toggle">\u25be Browse by chapter</button></div>
<div id="layout">
  <aside id="sidebar"></aside>
  <section id="content">
    <div id="crumb"></div>
    <div id="subbar"></div>
    <div id="grid"></div>
    <div id="more"></div>
    <div id="empty"><h3>No doubts found</h3><p>Try a different chapter, type, or search term.</p></div>
  </section>
</div>
<script>
const THREADS = /*__DATA__*/;
const DISCORD_ICON = '<svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor"><path d="M20.3 4.4A19.8 19.8 0 0 0 15.4 3l-.2.5a18 18 0 0 1 4.3 1.4 13.6 13.6 0 0 0-15 0A18 18 0 0 1 8.8 3.5L8.6 3a19.8 19.8 0 0 0-4.9 1.4A20.6 20.6 0 0 0 .2 18.2a19.9 19.9 0 0 0 6 3l.8-1.3a13 13 0 0 1-2-1l.5-.4a14.2 14.2 0 0 0 12.2 0l.5.4a13 13 0 0 1-2 1l.8 1.3a19.9 19.9 0 0 0 6-3 20.5 20.5 0 0 0-2.5-13.5ZM8.3 15c-1 0-1.7-.9-1.7-2s.8-2 1.7-2 1.7.9 1.7 2-.7 2-1.7 2Zm7.4 0c-1 0-1.7-.9-1.7-2s.8-2 1.7-2 1.7.9 1.7 2-.7 2-1.7 2Z"/></svg>';

const state = { subject:'chemistry', chapter:'__all__', sub:'__all__', q:'', limit:400 };
const $ = s => document.querySelector(s);
const esc = s => (s||'').replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmtDate = ms => ms ? new Date(ms).toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'}) : '';

const SUBJECTS = ['chemistry','physics','maths','biology'];
SUBJECTS.forEach(s=>{ const el=$('#cnt-'+s); if(el) el.textContent = THREADS.filter(t=>t.s===s).length; });
$('#thread-count').textContent = THREADS.length;
{ const ae=$('#cnt-all'); if(ae) ae.textContent = THREADS.length; }
// hide subject tabs that have zero doubts (keeps the bar clean on smaller servers)
SUBJECTS.forEach(s=>{ if(!THREADS.some(t=>t.s===s)){ const tab=document.querySelector('.s-tab[data-s="'+s+'"]'); if(tab) tab.style.display='none'; } });
if(!THREADS.some(t=>t.s===state.subject)){ const first=THREADS[0]; if(first){ state.subject=first.s; document.querySelectorAll('.s-tab').forEach(t=>t.classList.toggle('active',t.dataset.s===first.s)); } }

const BRANCH_ORDER = {
  chemistry:['Physical','Organic','Inorganic','Uncategorized'],
  physics:['Mechanics','Heat & Thermo','Waves & Oscillations','Electromagnetism','Optics','Modern & Electronics','Other','Uncategorized'],
  maths:['Algebra','Trigonometry','Coordinate Geometry','Calculus','Vectors & 3D','Probability & Stats','Other','Uncategorized'],
  biology:['Biology','Uncategorized'],
};

function subjectThreads(){ return state.subject==='all' ? THREADS.slice() : THREADS.filter(t=>t.s===state.subject); }

function renderSidebar(){
  if(state.subject==='all'){
    const cap=x=>x.charAt(0).toUpperCase()+x.slice(1);
    let h='<div class="ch-item ch-all active">All doubts <span class="n">'+THREADS.length+'</span></div>';
    h+='<div class="branch"><div class="branch-h">Jump to subject</div>';
    ['chemistry','physics','maths','biology'].forEach(su=>{const n=THREADS.filter(t=>t.s===su).length;if(!n)return;h+='<div class="ch-item" data-jump="'+su+'">'+cap(su)+' <span class="n">'+n+'</span></div>';});
    h+='</div>';
    $('#sidebar').innerHTML=h;
    $('#sidebar').querySelectorAll('[data-jump]').forEach(el=>el.onclick=()=>{document.querySelectorAll('.s-tab').forEach(t=>t.classList.toggle('active',t.dataset.s===el.dataset.jump));state.subject=el.dataset.jump;state.chapter='__all__';state.sub='__all__';state.limit=400;closeChapters();render();});
    return;
  }
  const ts = subjectThreads();
  const chMap = {};
  ts.forEach(t=>{ if(!chMap[t.ch]) chMap[t.ch]={label:t.cl,count:0,branch:t.b}; chMap[t.ch].count++; });
  const branches = {};
  Object.entries(chMap).forEach(([ch,o])=>{ (branches[o.branch]=branches[o.branch]||[]).push({ch,...o}); });
  let h = '<div class="ch-item ch-all'+(state.chapter==='__all__'?' active':'')+'" data-ch="__all__">All chapters <span class="n">'+ts.length+'</span></div>';
  (BRANCH_ORDER[state.subject]||Object.keys(branches)).forEach(bn=>{
    const items=(branches[bn]||[]).sort((a,b)=>b.count-a.count);
    if(!items.length) return;
    h += '<div class="branch"><div class="branch-h">'+esc(bn)+'</div>';
    items.forEach(it=>{ h += '<div class="ch-item'+(state.chapter===it.ch?' active':'')+'" data-ch="'+it.ch+'">'+esc(it.label.replace(/^.*?: /,''))+' <span class="n">'+it.count+'</span></div>'; });
    h += '</div>';
  });
  $('#sidebar').innerHTML = h;
  $('#sidebar').querySelectorAll('.ch-item').forEach(el=>el.onclick=()=>{ state.chapter=el.dataset.ch; state.sub='__all__'; state.limit=400; closeChapters(); render(); });
}

function renderSubbar(){
  const bar=$('#subbar');
  if(state.chapter==='__all__'){ bar.innerHTML=''; return; }
  const ts=subjectThreads().filter(t=>t.ch===state.chapter);
  const subs={}; ts.forEach(t=>subs[t.sl]=(subs[t.sl]||0)+1);
  const keys=Object.keys(subs);
  if(keys.length<=1){ bar.innerHTML=''; return; }
  let h='<div class="sub-chip'+(state.sub==='__all__'?' active':'')+'" data-sub="__all__">All types</div>';
  keys.sort((a,b)=>subs[b]-subs[a]).forEach(k=>{ h+='<div class="sub-chip'+(state.sub===k?' active':'')+'" data-sub="'+esc(k)+'">'+esc(k)+' ('+subs[k]+')</div>'; });
  bar.innerHTML=h;
  bar.querySelectorAll('.sub-chip').forEach(el=>el.onclick=()=>{ state.sub=el.dataset.sub; state.limit=400; render(); });
}

function currentList(){
  let ts=subjectThreads();
  if(state.chapter!=='__all__') ts=ts.filter(t=>t.ch===state.chapter);
  if(state.sub!=='__all__') ts=ts.filter(t=>t.sl===state.sub);
  if(state.q){ const q=state.q.toLowerCase(); ts=ts.filter(t=>t.t.toLowerCase().includes(q)||(t.p||'').toLowerCase().includes(q)||t.cl.toLowerCase().includes(q)||t.sl.toLowerCase().includes(q)); }
  // pinned posts (no subject) ride the top of EVERY subject's default view, like Discord
  if(state.subject!=='all' && state.chapter==='__all__' && !state.q){ ts = THREADS.filter(t=>t.pin).concat(ts); }
  return ts;
}

function renderGrid(){
  const all=currentList();
  const ts = all.slice(0, state.limit||400);
  $('#crumb').innerHTML = all.length+' doubt'+(all.length===1?'':'s')+(state.chapter!=='__all__'?' in <b>'+esc((all[0]?all[0].cl:state.chapter))+'</b>':'');
  const grid=$('#grid'); const more=$('#more');
  if(!all.length){ grid.innerHTML=''; if(more)more.innerHTML=''; $('#empty').style.display='block'; return; }
  $('#empty').style.display='none';
  grid.innerHTML = ts.map(t=>{
    const low = t.cf<2, isUncat = t.ch==='uncat';
    const chTag = t.pin ? '' : (isUncat ? '<span class="tag tag-uncat">Uncategorized</span>'
      : '<span class="tag tag-ch">'+esc(t.cl)+'</span>'+(t.sl&&t.sl!==t.cl?'<span class="tag tag-sub">'+esc(t.sl)+'</span>':''));
    const lowTag = (low && !isUncat) ? '<span class="tag tag-low" title="Low-confidence guess — only a generic keyword matched. Review if needed.">? guess</span>' : '';
    const imgTag = t.im ? '<span class="tag tag-img" title="This doubt includes an image — open it in Discord to view.">📎 image</span>' : '';
    return '<div class="card" onclick="window.open(\'' + t.u + '\',\'_blank\')">'
      +'<div class="card-title">'+esc(t.t||'(untitled)')+'</div>'
      +(t.p?'<div class="card-preview">'+esc(t.p)+'</div>':'')
      +'<div class="tags">'+(t.pin?'<span class="tag tag-pin">\ud83d\udccc Pinned</span>':'')+(t.sv?'<span class="tag tag-solved">\u2705 Solved</span>':'')+chTag+lowTag+imgTag+'</div>'
      +'<div class="footer">'
      +(t.a?'<a class="t-link-btn t-link-ao" href="'+t.a+'" target="_blank" onclick="event.stopPropagation()">AO</a>':'')
      +'<a class="t-link-btn t-link-discord" href="'+t.u+'" target="_blank" onclick="event.stopPropagation()">'+DISCORD_ICON+' Discord</a>'
      +(t.d?'<span class="card-date">'+fmtDate(t.d)+'</span>':'')
      +'</div></div>';
  }).join('');
  if(more){ if(all.length>ts.length){ const nxt=Math.min(400, all.length-ts.length); more.innerHTML='<button id="more-btn">Show '+nxt+' more \u00b7 '+(all.length-ts.length)+' left</button>'; $('#more-btn').onclick=()=>{ state.limit=(state.limit||400)+400; renderGrid(); }; } else more.innerHTML=''; }
}

function render(){ renderSidebar(); renderSubbar(); renderGrid(); }
document.querySelectorAll('.s-tab').forEach(tab=>tab.onclick=()=>{
  document.querySelectorAll('.s-tab').forEach(t=>t.classList.remove('active'));
  tab.classList.add('active');
  state.subject=tab.dataset.s; state.chapter='__all__'; state.sub='__all__'; state.limit=400; render();
});
let __searchTimer; function closeChapters(){ const sb=$('#sidebar'); if(sb) sb.classList.remove('open'); const b=$('#ch-toggle'); if(b) b.textContent='\u25be Browse by chapter'; }
{ const b=$('#ch-toggle'); if(b) b.onclick=()=>{ const sb=$('#sidebar'); const open=sb.classList.toggle('open'); b.textContent=open?'\u25b4 Hide chapters':'\u25be Browse by chapter'; }; }
$('#search-input').addEventListener('input', e=>{ const v=e.target.value.trim(); clearTimeout(__searchTimer); __searchTimer=setTimeout(()=>{ state.q=v; state.limit=400; render(); }, 120); });
render();
</script>
</body>
</html>
